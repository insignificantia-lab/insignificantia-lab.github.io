name: Install Compact Mobile Archive V1.9.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact-mobile-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch current Archive mobile layout only
        shell: bash
        run: |
          set -euxo pipefail

          python - <<'PY'
          from pathlib import Path

          archive = Path("themes/insignificantia/ArchiveStyle.js")
          text = archive.read_text(encoding="utf-8")

          old_760 = """      @media (max-width: 760px) {
        .ins-archive-page {
          width: 100%;
          margin-left: 0;
          margin-right: 0;
          padding: 54px 18px 86px;
          box-sizing: border-box;
        }

        .ins-archive-header {
          margin-bottom: 28px;
        }

        .ins-archive-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }

        .ins-archive-year-grid {
          margin-top: 86px;
        }

        .ins-archive-card {
          padding: 20px;
        }
      }

      @media (max-width: 520px) {
        .ins-archive-grid {
          grid-template-columns: 1fr;
        }

        .ins-archive-card {
          aspect-ratio: 1.3 / 1;
        }
      }"""

          new_760 = """      @media (max-width: 760px) {
        .ins-archive-page {
          width: 100%;
          margin-left: 0;
          margin-right: 0;
          padding: 54px 18px 86px;
          box-sizing: border-box;
        }

        .ins-archive-header {
          margin-bottom: 28px;
        }

        .ins-archive-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }

        .ins-archive-year-grid {
          margin-top: 64px;
        }

        .ins-archive-card {
          aspect-ratio: 1.18 / 1;
          padding: 16px;
        }

        .ins-archive-card strong {
          font-size: clamp(22px, 6.2vw, 28px);
          line-height: 1.08;
        }

        .ins-archive-card small {
          font-size: 10px;
          line-height: 1.35;
          letter-spacing: 0.08em;
        }
      }

      @media (max-width: 520px) {
        .ins-archive-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }

        .ins-archive-card {
          aspect-ratio: 1.18 / 1;
          padding: 16px;
        }

        .ins-archive-card strong {
          font-size: clamp(21px, 6.4vw, 25px);
        }
      }"""

          if old_760 not in text:
              raise SystemExit(
                  "ERROR: expected V1.9.1 Archive mobile block was not found. "
                  "Refusing to overwrite an unknown newer layout."
              )

          archive.write_text(text.replace(old_760, new_760), encoding="utf-8")

          overrides = Path("themes/insignificantia/IntegrationOverrides.js")
          otext = overrides.read_text(encoding="utf-8")

          old_override = """        #theme-insignificantia .ins-archive-card {
          padding-left: 20px !important;
          padding-right: 20px !important;
        }"""

          new_override = """        #theme-insignificantia .ins-archive-card {
          padding: 16px !important;
        }"""

          if old_override not in otext:
              raise SystemExit(
                  "ERROR: expected V1.9.1 Archive override was not found. "
                  "Refusing to overwrite an unknown newer override."
              )

          overrides.write_text(
              otext.replace(old_override, new_override),
              encoding="utf-8"
          )
          PY

      - name: Verify compact two-column mobile Archive
        run: |
          set -euxo pipefail

          grep -F "grid-template-columns: repeat(2, minmax(0, 1fr));"             themes/insignificantia/ArchiveStyle.js

          grep -F "gap: 12px;"             themes/insignificantia/ArchiveStyle.js

          grep -F "aspect-ratio: 1.18 / 1;"             themes/insignificantia/ArchiveStyle.js

          grep -F "font-size: clamp(21px, 6.4vw, 25px);"             themes/insignificantia/ArchiveStyle.js

          grep -F "padding: 16px !important;"             themes/insignificantia/IntegrationOverrides.js

          if grep -A4 "@media (max-width: 520px)"             themes/insignificantia/ArchiveStyle.js             | grep -F "grid-template-columns: 1fr;"; then
            echo "ERROR: one-column phone override still exists."
            exit 1
          fi

          echo "Compact mobile Archive verified locally."

      - name: Commit and push safely
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             themes/insignificantia/ArchiveStyle.js             themes/insignificantia/IntegrationOverrides.js

          if git diff --cached --quiet; then
            echo "No V1.9.2 changes to commit."
            exit 0
          fi

          git commit -m "Compact Archive cards on mobile"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded."
              break
            fi

            if [ "$attempt" = "3" ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi

            sleep 3
          done

      - name: Verify remote main
        run: |
          set -euxo pipefail

          git fetch origin main

          git show origin/main:themes/insignificantia/ArchiveStyle.js             | grep -F "aspect-ratio: 1.18 / 1;"

          git show origin/main:themes/insignificantia/ArchiveStyle.js             | grep -F "gap: 12px;"

          git show origin/main:themes/insignificantia/IntegrationOverrides.js             | grep -F "padding: 16px !important;"

          echo "REMOTE MAIN VERIFIED: Compact Mobile Archive V1.9.2 is present."
