name: Install Insignificantia ARTICLE DETAIL V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Write theme files
        run: |
          mkdir -p "$(dirname 'themes/insignificantia/components/ArticleDetailPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArticleDetailPage.js'
          mkdir -p "$(dirname 'themes/insignificantia/ArticleDetailStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/ArticleDetailStyle.js'

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/insignificantia
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Insignificantia ARTICLE DETAIL V1"
          git push
