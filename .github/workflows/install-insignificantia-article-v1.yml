name: Install Insignificantia ARTICLE V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Write theme files
        run: |
          mkdir -p "$(dirname 'themes/insignificantia/components/ArticleListPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArticleListPage.js'
          mkdir -p "$(dirname 'themes/insignificantia/ArticleStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/ArticleStyle.js'

      - name: Set 15 posts per ARTICLE page
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/deploy-pages.yml")
          text = path.read_text(encoding="utf-8")

          if 'NEXT_PUBLIC_POSTS_PER_PAGE:' not in text:
              marker = '      NEXT_PUBLIC_THEME_SWITCH: "false"\n'
              if marker not in text:
                  raise SystemExit(
                      "Could not find NEXT_PUBLIC_THEME_SWITCH in deploy-pages.yml"
                  )
              text = text.replace(
                  marker,
                  marker + '      NEXT_PUBLIC_POSTS_PER_PAGE: "15"\n'
              )

          path.write_text(text, encoding="utf-8")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/insignificantia .github/workflows/deploy-pages.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install Insignificantia ARTICLE V1"
          git push
