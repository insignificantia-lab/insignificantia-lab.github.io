name: Install Compact Mobile Archive V1.9.2 FIXED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact-mobile-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch current Archive mobile layout only
        env:
          PATCH_SCRIPT_B64: 
        run: |
          set -euxo pipefail
          echo "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/patch_archive_v192.py
          python /tmp/patch_archive_v192.py

      - name: Verify compact two-column mobile Archive
        run: |
          set -euxo pipefail
          grep -F "grid-template-columns: repeat(2, minmax(0, 1fr));" themes/insignificantia/ArchiveStyle.js
          grep -F "gap: 12px;" themes/insignificantia/ArchiveStyle.js
          grep -F "aspect-ratio: 1.18 / 1;" themes/insignificantia/ArchiveStyle.js
          grep -F "font-size: clamp(21px, 6.4vw, 25px);" themes/insignificantia/ArchiveStyle.js
          grep -F "padding: 16px !important;" themes/insignificantia/IntegrationOverrides.js

          if grep -A4 "@media (max-width: 520px)" themes/insignificantia/ArchiveStyle.js | grep -F "grid-template-columns: 1fr;"; then
            echo "ERROR: one-column phone override still exists."
            exit 1
          fi

          echo "Compact mobile Archive verified locally."

      - name: Commit and push safely
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add themes/insignificantia/ArchiveStyle.js themes/insignificantia/IntegrationOverrides.js

          if git diff --cached --quiet; then
            echo "No V1.9.2 changes to commit."
            exit 0
          fi

          git commit -m "Compact Archive cards on mobile"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded."
              break
            fi

            if [ "$attempt" = "3" ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi

            sleep 3
          done

      - name: Verify remote main
        run: |
          set -euxo pipefail
          git fetch origin main
          git show origin/main:themes/insignificantia/ArchiveStyle.js | grep -F "aspect-ratio: 1.18 / 1;"
          git show origin/main:themes/insignificantia/ArchiveStyle.js | grep -F "gap: 12px;"
          git show origin/main:themes/insignificantia/IntegrationOverrides.js | grep -F "padding: 16px !important;"
          echo "REMOTE MAIN VERIFIED: Compact Mobile Archive V1.9.2 FIXED is present."
