name: Fix Insignificantia ARTICLE Route V1.7.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-article-route:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Replace pages/article.js
        run: |
          mkdir -p pages
          echo '' | base64 --decode > pages/article.js

      - name: Verify source before commit
        run: |
          set -euxo pipefail
          grep -F "fetchGlobalAllData" pages/article.js
          grep -F "@/lib/db/SiteDataApi" pages/article.js
          grep -F "layoutName='LayoutPostList'" pages/article.js
          grep -F "props.page = 1" pages/article.js
          if grep -F "@/lib/db/getSiteData" pages/article.js; then
            echo "ERROR: legacy getSiteData import is still present."
            exit 1
          fi
          echo "ARTICLE route source verified."

      - name: Commit and push safely
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/article.js
          if git diff --cached --quiet; then
            echo "No ARTICLE route changes to commit."
            exit 0
          fi
          git commit -m "Fix ARTICLE route for current NotionNext data API"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Push succeeded."
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi
            sleep 3
          done

      - name: Verify remote main
        run: |
          set -euxo pipefail
          git fetch origin main
          git show origin/main:pages/article.js | grep -F "@/lib/db/SiteDataApi"
          git show origin/main:pages/article.js | grep -F "props.page = 1"
          if git show origin/main:pages/article.js | grep -F "@/lib/db/getSiteData"; then
            echo "ERROR: remote main still contains legacy getSiteData import."
            exit 1
          fi
          echo "REMOTE MAIN VERIFIED: ARTICLE V1.7.2 is present."
