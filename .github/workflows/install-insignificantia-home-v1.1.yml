name: Install Insignificantia Home V1.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Write Insignificantia Home V1.1 files
        run: |
          mkdir -p "$(dirname 'themes/insignificantia/index.js')"
          echo '' | base64 --decode > 'themes/insignificantia/index.js' 
          mkdir -p "$(dirname 'themes/insignificantia/config.js')"
          echo '' | base64 --decode > 'themes/insignificantia/config.js' 
          mkdir -p "$(dirname 'themes/insignificantia/style.js')"
          echo '' | base64 --decode > 'themes/insignificantia/style.js' 
          mkdir -p "$(dirname 'themes/insignificantia/components/SiteHeader.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/SiteHeader.js' 
          mkdir -p "$(dirname 'themes/insignificantia/components/HomePage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/HomePage.js' 
          mkdir -p "$(dirname 'themes/insignificantia/components/SiteFooter.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/SiteFooter.js' 
          mkdir -p "$(dirname 'themes/insignificantia/components/Hero.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/Hero.js' 
          mkdir -p "$(dirname 'themes/insignificantia/components/PostCard.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/PostCard.js' 

      - name: Commit V1.1 theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/insignificantia
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refine Insignificantia homepage V1.1"
          git push
