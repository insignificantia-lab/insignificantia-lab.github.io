name: Install HQ media test pack

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'HQ test ZIP at repository root'
        required: true
        default: 'Insignificantia-media-test-HQ.zip'
        type: string
  push:
    branches:
      - main
    paths:
      - 'Insignificantia-media-test-HQ.zip'

permissions:
  contents: write

jobs:
  install-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve HQ test package
        id: pack
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PACK='${{ inputs.package_name }}'
          else
            PACK='Insignificantia-media-test-HQ.zip'
          fi

          if [[ -z "$PACK" || "$PACK" == */* || "$PACK" != *.zip ]]; then
            echo "Invalid package name: $PACK"
            echo "The ZIP must be stored at the repository root."
            exit 1
          fi

          if [[ ! -f "$PACK" ]]; then
            echo "Package not found at repository root: $PACK"
            exit 1
          fi

          echo "name=$PACK" >> "$GITHUB_OUTPUT"

      - name: Extract HQ test media
        shell: bash
        env:
          PACK: ${{ steps.pack.outputs.name }}
        run: |
          unzip -o "$PACK" -d .

      - name: Verify exact test payload
        shell: bash
        run: |
          test "$(stat -c %s public/images/insignificantia/hero/hero-01.webp)" -eq 280476
          test "$(stat -c %s public/images/insignificantia/hero/hero-02.webp)" -eq 51892
          test "$(stat -c %s public/images/insignificantia/hero/hero-03.webp)" -eq 114464
          test "$(stat -c %s public/images/insignificantia/portfolio/work-01.webp)" -eq 75156
          test "$(stat -c %s public/images/insignificantia/portfolio/work-02.webp)" -eq 316428
          test "$(stat -c %s public/images/insignificantia/portfolio/work-03.webp)" -eq 139884

      - name: Commit installed media and consume pack
        shell: bash
        env:
          PACK: ${{ steps.pack.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/insignificantia/hero/hero-01.webp
          git add public/images/insignificantia/hero/hero-02.webp
          git add public/images/insignificantia/hero/hero-03.webp
          git add public/images/insignificantia/portfolio/work-01.webp
          git add public/images/insignificantia/portfolio/work-02.webp
          git add public/images/insignificantia/portfolio/work-03.webp
          git rm -f -- "$PACK"

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi

          git commit -m "Visual test: install high-quality media assets"
          git pull --rebase origin main
          git push origin HEAD:main
