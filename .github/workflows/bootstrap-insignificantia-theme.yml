name: Bootstrap Insignificantia theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy example theme
        run: |
          if [ -d "themes/insignificantia" ]; then
            echo "themes/insignificantia already exists; nothing to do."
            exit 0
          fi
          cp -R themes/example themes/insignificantia

      - name: Commit theme
        run: |
          if git diff --quiet -- themes/insignificantia && [ -z "$(git status --porcelain themes/insignificantia)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/insignificantia
          git commit -m "Create Insignificantia theme from example"
          git push
