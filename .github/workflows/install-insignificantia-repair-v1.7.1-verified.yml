name: Install Insignificantia Repair V1.7.1 VERIFIED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MAIN explicitly
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Write cumulative V1.7 source files
        run: |
          mkdir -p "$(dirname 'pages/article.js')"
          echo '' | base64 --decode > 'pages/article.js'
          mkdir -p "$(dirname 'themes/insignificantia/style.js')"
          echo '' | base64 --decode > 'themes/insignificantia/style.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/SiteHeader.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/SiteHeader.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/HomePage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/HomePage.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArticleListPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArticleListPage.js'
          mkdir -p "$(dirname 'themes/insignificantia/ArticleStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/ArticleStyle.js'
          mkdir -p "$(dirname 'themes/insignificantia/ArchiveStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/ArchiveStyle.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArticleDetailPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArticleDetailPage.js'
          mkdir -p "$(dirname 'themes/insignificantia/ArticleDetailStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/ArticleDetailStyle.js'
          mkdir -p "$(dirname 'themes/insignificantia/AboutStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/AboutStyle.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/SiteFooter.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/SiteFooter.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/PostCard.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/PostCard.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArchivePage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArchivePage.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArchiveResultPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArchiveResultPage.js'
          mkdir -p "$(dirname 'themes/insignificantia/index.js')"
          echo '' | base64 --decode > 'themes/insignificantia/index.js'
          mkdir -p "$(dirname 'themes/insignificantia/IntegrationOverrides.js')"
          echo '' | base64 --decode > 'themes/insignificantia/IntegrationOverrides.js'
          mkdir -p "$(dirname 'themes/theme.js')"
          echo '' | base64 --decode > 'themes/theme.js'
          mkdir -p "$(dirname 'components/LoadingCover.js')"
          echo '' | base64 --decode > 'components/LoadingCover.js'

      - name: Verify local source BEFORE commit
        run: |
          set -euxo pipefail

          test -f themes/insignificantia/IntegrationOverrides.js
          grep -F "IntegrationOverrides" themes/insignificantia/index.js
          ! grep -F "ExampleTheme" themes/insignificantia/index.js
          grep -F -- "--ins-content: 900px" themes/insignificantia/style.js
          grep -F "max-width: 900px !important" themes/insignificantia/IntegrationOverrides.js
          grep -F "max-width: 810px !important" themes/insignificantia/IntegrationOverrides.js
          grep -F "© 2026 · Powered by NotionNext · Hosted with GitHub Pages" themes/insignificantia/components/SiteFooter.js
          grep -F "categoryOptions" themes/insignificantia/components/ArchivePage.js
          grep -F "data-ins-loading='home'" themes/theme.js
          grep -F "bg-[#202d35]" components/LoadingCover.js

          echo "Right-click config is intentionally untouched in V1.7.1."
          echo "=== git status before commit ==="
          git status --short

      - name: Commit and push safely
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             themes/insignificantia             themes/theme.js             components/LoadingCover.js             pages/article.js 
          if git diff --cached --quiet; then
            echo "ERROR: No source changes detected. Refusing to report success."
            exit 1
          fi

          git commit -m "Repair Insignificantia V1.7.1 and loading shell"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded."
              break
            fi

            if [ "$attempt" = "3" ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi

            sleep 3
          done

      - name: Verify REMOTE main after push
        run: |
          set -euxo pipefail

          git fetch origin main

          git show origin/main:themes/insignificantia/IntegrationOverrides.js             | grep -F "max-width: 900px !important"

          git show origin/main:themes/insignificantia/index.js             | grep -F "IntegrationOverrides"

          if git show origin/main:themes/insignificantia/index.js             | grep -F "ExampleTheme"; then
            echo "ERROR: remote main still contains ExampleTheme fallback."
            exit 1
          fi

          git show origin/main:themes/insignificantia/style.js             | grep -F -- "--ins-content: 900px"

          git show origin/main:themes/theme.js             | grep -F "data-ins-loading='home'"

          git show origin/main:components/LoadingCover.js             | grep -F "bg-[#202d35]"

          git show origin/main:themes/insignificantia/components/SiteFooter.js             | grep -F "© 2026 · Powered by NotionNext · Hosted with GitHub Pages"

          echo "REMOTE MAIN VERIFIED: V1.7 source is present."
