name: Fix ARTICLE with Native Pagination V1.7.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-native-article:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Remove custom ARTICLE route and patch native pagination
        run: |
          mkdir -p "$(dirname 'pages/page/[page].js')"
          echo '' | base64 --decode > 'pages/page/[page].js'
          mkdir -p "$(dirname 'themes/insignificantia/components/SiteHeader.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/SiteHeader.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/HomePage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/HomePage.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArticleListPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArticleListPage.js'
          rm -f pages/article.js

      - name: Verify source before commit
        run: |
          set -euxo pipefail

          test ! -f pages/article.js
          grep -F "params: { page: '' + (i + 1) }" "pages/page/[page].js"
          grep -F "Math.max(" "pages/page/[page].js"
          grep -F "href='/page/1'" themes/insignificantia/components/SiteHeader.js
          grep -F "href='/page/1'" themes/insignificantia/components/HomePage.js
          grep -F "? '/page/1'" themes/insignificantia/components/ArticleListPage.js

          echo "Native ARTICLE route source verified."

      - name: Commit and push safely
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A             pages/article.js             "pages/page/[page].js"             themes/insignificantia/components/SiteHeader.js             themes/insignificantia/components/HomePage.js             themes/insignificantia/components/ArticleListPage.js

          if git diff --cached --quiet; then
            echo "ERROR: no ARTICLE route changes detected."
            exit 1
          fi

          git commit -m "Use native page route for ARTICLE"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded."
              break
            fi

            if [ "$attempt" = "3" ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi

            sleep 3
          done

      - name: Verify remote main
        run: |
          set -euxo pipefail

          git fetch origin main

          if git cat-file -e origin/main:pages/article.js 2>/dev/null; then
            echo "ERROR: pages/article.js still exists on remote main."
            exit 1
          fi

          git show 'origin/main:pages/page/[page].js'             | grep -F "params: { page: '' + (i + 1) }"

          git show origin/main:themes/insignificantia/components/SiteHeader.js             | grep -F "href='/page/1'"

          git show origin/main:themes/insignificantia/components/HomePage.js             | grep -F "href='/page/1'"

          echo "REMOTE MAIN VERIFIED: ARTICLE now uses /page/1."
