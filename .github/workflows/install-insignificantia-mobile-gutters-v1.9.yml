name: Install Mobile Gutters V1.9

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-gutters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Write mobile layout fixes
        run: |
          mkdir -p "$(dirname 'themes/insignificantia/IntegrationOverrides.js')"
          echo '' | base64 --decode > 'themes/insignificantia/IntegrationOverrides.js'
          mkdir -p "$(dirname 'themes/insignificantia/ArticleStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/ArticleStyle.js'
          mkdir -p "$(dirname 'themes/insignificantia/ArchiveStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/ArchiveStyle.js'
          mkdir -p "$(dirname 'themes/insignificantia/ArticleDetailStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/ArticleDetailStyle.js'

      - name: Verify source before commit
        run: |
          set -euxo pipefail

          grep -F "width: calc(100% - 36px) !important" themes/insignificantia/IntegrationOverrides.js
          grep -F "margin-left: 18px !important" themes/insignificantia/IntegrationOverrides.js
          grep -F "width: calc(100% - 40px) !important" themes/insignificantia/IntegrationOverrides.js
          grep -F "margin-left: 20px !important" themes/insignificantia/IntegrationOverrides.js
          grep -F "padding-left: 24px !important" themes/insignificantia/IntegrationOverrides.js

          grep -F "margin-left: 18px" themes/insignificantia/ArticleStyle.js
          grep -F "margin-left: 18px" themes/insignificantia/ArchiveStyle.js
          grep -F "margin-left: 20px" themes/insignificantia/ArticleDetailStyle.js

          echo "Mobile gutter source verified."

      - name: Commit and push safely
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             themes/insignificantia/IntegrationOverrides.js             themes/insignificantia/ArticleStyle.js             themes/insignificantia/ArchiveStyle.js             themes/insignificantia/ArticleDetailStyle.js

          if git diff --cached --quiet; then
            echo "No mobile gutter changes to commit."
            exit 0
          fi

          git commit -m "Improve mobile gutters for article pages"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded."
              break
            fi

            if [ "$attempt" = "3" ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi

            sleep 3
          done

      - name: Verify remote main
        run: |
          set -euxo pipefail

          git fetch origin main

          git show origin/main:themes/insignificantia/IntegrationOverrides.js             | grep -F "width: calc(100% - 36px) !important"

          git show origin/main:themes/insignificantia/IntegrationOverrides.js             | grep -F "width: calc(100% - 40px) !important"

          git show origin/main:themes/insignificantia/ArticleStyle.js             | grep -F "margin-left: 18px"

          git show origin/main:themes/insignificantia/ArticleDetailStyle.js             | grep -F "margin-left: 20px"

          echo "REMOTE MAIN VERIFIED: Mobile Gutters V1.9 is present."
