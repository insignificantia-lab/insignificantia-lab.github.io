name: Install ARTICLE and ARCHIVE Context V1.8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-context:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Write ARTICLE / ARCHIVE context files
        run: |
          mkdir -p "$(dirname 'themes/insignificantia/components/ArticleListPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArticleListPage.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArchivePage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArchivePage.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArchiveResultPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArchiveResultPage.js'
          mkdir -p "$(dirname 'themes/insignificantia/ArticleStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/ArticleStyle.js'

      - name: Verify source before commit
        run: |
          set -euxo pipefail

          grep -F "ins-card-category" themes/insignificantia/components/ArticleListPage.js
          grep -F "contextLabel='YEAR'" themes/insignificantia/components/ArchivePage.js
          grep -F "contextLabel={isCategory ? 'CATEGORY' : 'TAG'}" themes/insignificantia/components/ArchiveResultPage.js
          grep -F ".ins-result-context-value" themes/insignificantia/ArticleStyle.js
          grep -F ".ins-card-category" themes/insignificantia/ArticleStyle.js
          grep -F "? '/page/1'" themes/insignificantia/components/ArticleListPage.js

          echo "ARTICLE / ARCHIVE V1.8 source verified."

      - name: Commit and push safely
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             themes/insignificantia/components/ArticleListPage.js             themes/insignificantia/components/ArchivePage.js             themes/insignificantia/components/ArchiveResultPage.js             themes/insignificantia/ArticleStyle.js

          if git diff --cached --quiet; then
            echo "No V1.8 changes to commit."
            exit 0
          fi

          git commit -m "Add categories and archive result context"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded."
              break
            fi

            if [ "$attempt" = "3" ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi

            sleep 3
          done

      - name: Verify remote main
        run: |
          set -euxo pipefail

          git fetch origin main

          git show origin/main:themes/insignificantia/components/ArticleListPage.js             | grep -F "ins-card-category"

          git show origin/main:themes/insignificantia/components/ArchivePage.js             | grep -F "contextLabel='YEAR'"

          git show origin/main:themes/insignificantia/components/ArchiveResultPage.js             | grep -F "contextLabel={isCategory ? 'CATEGORY' : 'TAG'}"

          git show origin/main:themes/insignificantia/ArticleStyle.js             | grep -F ".ins-result-context-value"

          echo "REMOTE MAIN VERIFIED: V1.8 is present."
