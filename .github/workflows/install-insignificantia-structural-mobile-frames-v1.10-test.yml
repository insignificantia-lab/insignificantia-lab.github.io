name: Install Structural Mobile Frames V1.10 TEST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  structural-mobile-frames:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Write component-level mobile frames
        run: |
          mkdir -p "$(dirname 'themes/insignificantia/components/ArticleListPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArticleListPage.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArchivePage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArchivePage.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArticleDetailPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArticleDetailPage.js'

      - name: Verify source before commit
        run: |
          set -euxo pipefail

          grep -F "data-mobile-frame='article-list-v1.10'" themes/insignificantia/components/ArticleListPage.js
          grep -F "data-mobile-frame='archive-v1.10'" themes/insignificantia/components/ArchivePage.js
          grep -F "data-mobile-frame='article-detail-v1.10'" themes/insignificantia/components/ArticleDetailPage.js

          grep -F "px-5 md:px-0" themes/insignificantia/components/ArticleListPage.js
          grep -F "px-5 md:px-0" themes/insignificantia/components/ArchivePage.js
          grep -F "px-5 md:px-0" themes/insignificantia/components/ArticleDetailPage.js

          grep -F "maxWidth: '900px'" themes/insignificantia/components/ArticleListPage.js
          grep -F "maxWidth: '980px'" themes/insignificantia/components/ArchivePage.js
          grep -F "maxWidth: '810px'" themes/insignificantia/components/ArticleDetailPage.js

          echo "Structural mobile frames verified locally."

      - name: Commit and push safely
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             themes/insignificantia/components/ArticleListPage.js             themes/insignificantia/components/ArchivePage.js             themes/insignificantia/components/ArticleDetailPage.js

          if git diff --cached --quiet; then
            echo "No V1.10 structural changes to commit."
            exit 0
          fi

          git commit -m "Add structural mobile content frames"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded."
              break
            fi

            if [ "$attempt" = "3" ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi

            sleep 3
          done

      - name: Verify remote main
        run: |
          set -euxo pipefail

          git fetch origin main

          git show origin/main:themes/insignificantia/components/ArticleListPage.js             | grep -F "data-mobile-frame='article-list-v1.10'"

          git show origin/main:themes/insignificantia/components/ArchivePage.js             | grep -F "data-mobile-frame='archive-v1.10'"

          git show origin/main:themes/insignificantia/components/ArticleDetailPage.js             | grep -F "data-mobile-frame='article-detail-v1.10'"

          echo "REMOTE MAIN VERIFIED: Structural Mobile Frames V1.10 is present."
