name: Install Insignificantia Integration Fix V1.6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Write cumulative V1.6 theme files
        run: |
          mkdir -p "$(dirname 'pages/article.js')"
          echo '' | base64 --decode > 'pages/article.js'
          mkdir -p "$(dirname 'themes/insignificantia/style.js')"
          echo '' | base64 --decode > 'themes/insignificantia/style.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/SiteHeader.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/SiteHeader.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/HomePage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/HomePage.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArticleListPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArticleListPage.js'
          mkdir -p "$(dirname 'themes/insignificantia/ArticleStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/ArticleStyle.js'
          mkdir -p "$(dirname 'themes/insignificantia/ArchiveStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/ArchiveStyle.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArticleDetailPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArticleDetailPage.js'
          mkdir -p "$(dirname 'themes/insignificantia/ArticleDetailStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/ArticleDetailStyle.js'
          mkdir -p "$(dirname 'themes/insignificantia/AboutStyle.js')"
          echo '' | base64 --decode > 'themes/insignificantia/AboutStyle.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/SiteFooter.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/SiteFooter.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/PostCard.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/PostCard.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArchivePage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArchivePage.js'
          mkdir -p "$(dirname 'themes/insignificantia/components/ArchiveResultPage.js')"
          echo '' | base64 --decode > 'themes/insignificantia/components/ArchiveResultPage.js'
          mkdir -p "$(dirname 'themes/insignificantia/index.js')"
          echo '' | base64 --decode > 'themes/insignificantia/index.js'
          mkdir -p "$(dirname 'themes/insignificantia/IntegrationOverrides.js')"
          echo '' | base64 --decode > 'themes/insignificantia/IntegrationOverrides.js'

      - name: Restore native browser right-click menu
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("conf/right-click-menu.js")
          if not path.exists():
              raise SystemExit(
                  "conf/right-click-menu.js was not found; "
                  "NotionNext version layout may have changed."
              )

          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"(CUSTOM_RIGHT_CLICK_CONTEXT_MENU\s*:\s*)"
              r"(.*?)(,\s*(?:\n|$))",
              re.S
          )

          updated, count = pattern.subn(
              r"\1false\3",
              text,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  "CUSTOM_RIGHT_CLICK_CONTEXT_MENU was not found "
                  "in conf/right-click-menu.js"
              )

          path.write_text(updated, encoding="utf-8")
          print("CUSTOM_RIGHT_CLICK_CONTEXT_MENU = false")

      - name: Commit changes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add themes/insignificantia pages/article.js conf/right-click-menu.js

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Install Insignificantia integration fix V1.6"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Remote main changed again; retrying..."
            sleep 3
          done

          echo "Push failed after 3 attempts."
          exit 1
